name: BotONE iOS release (self-hosted)

# Mirrors botone-release-ios.yml on a personal macOS ARM64 runner registered to this repository.
# Deliberately manual only: never add pull_request or push triggers here, because
# a public repository must not run untrusted code on a self-hosted machine.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (empty uses the workflow run number)
        type: string
        default: ""

permissions:
  contents: read

# Workflow-level so that `uses:` actions (node, pod and archive downloads) inherit them too:
# direct connections to GitHub and CDNs time out from this runner's network; route through the
# machine's local proxy (override with the RUNNER_PROXY_URL repository variable).
env:
  HTTPS_PROXY: ${{ vars.RUNNER_PROXY_URL || 'http://127.0.0.1:7897' }}
  HTTP_PROXY: ${{ vars.RUNNER_PROXY_URL || 'http://127.0.0.1:7897' }}
  NO_PROXY: localhost,127.0.0.1

jobs:
  build:
    name: Signed iOS IPA on self-hosted runner
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
      BOTONE_MOBILE_APP_ID: ${{ vars.BOTONE_MOBILE_APP_ID }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Self-hosted runners have no node preinstalled, so every node step must come after
      # setup-node; python3 ships with macOS and the Xcode toolchain.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate signing configuration and prepare mobile identity
        env: &ios-signing
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          IOS_NOTIFICATION_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_PROFILE_BASE64 }}
        run: |
          node .github/builds/release-config.mjs ios
          python3 .github/builds/build-ios-release.py --validate-only
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@rakazo/mobile..."
      - name: Generate iOS project
        run: pnpm --filter @rakazo/mobile exec expo prebuild --platform ios
      - name: Archive and export signed IPA
        env: *ios-signing
        run: python3 .github/builds/build-ios-release.py
      - name: Retain IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botone-ios-release-selfhosted-${{ github.run_number }}
          path: ${{ runner.temp }}/botone-ios-release/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Summarize build
        run: echo 'Signed App Store Connect IPA is available in this run’s artifacts. It is not published to GitHub Releases or submitted to the store.' >> "$GITHUB_STEP_SUMMARY"
