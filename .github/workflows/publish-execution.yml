name: Publish prepared computer image

on:
  pull_request:
    paths:
      - packages/adapters/src/native-harness/**
      - packages/native-runtime/**
      - infra/sandboxes/native-execution/**
      - infra/sandboxes/computer/**
      - pnpm-lock.yaml
      - .github/workflows/publish-execution.yml
  push:
    branches: [main]
    paths:
      - packages/adapters/src/native-harness/**
      - packages/native-runtime/**
      - infra/sandboxes/native-execution/**
      - infra/sandboxes/computer/**
      - pnpm-lock.yaml
      - .github/workflows/publish-execution.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: execution-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check prepared computer composition
        run: bash infra/sandboxes/native-execution/check-compose.sh
      - name: Build immutable artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t local/computer-base infra/sandboxes/computer
          docker build --build-arg COMPUTER_IMAGE=local/computer-base -t "local/computer:$SOURCE_SHA" infra/sandboxes/native-execution
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish artifact
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE}_computer"
          tags=("sha-$SOURCE_SHA" latest)
          for tag in "${tags[@]}"; do
            docker tag "local/computer:$SOURCE_SHA" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
