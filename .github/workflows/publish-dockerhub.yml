name: Publish Docker Hub amd64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check registry configuration
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$REGISTRY_USER" || { echo 'Missing DOCKERHUB_USERNAME'; exit 1; }
          test -n "$REGISTRY_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN'; exit 1; }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build application
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/compose/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local/app:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=dockerhub-app-amd64
          cache-to: type=gha,mode=max,scope=dockerhub-app-amd64
          provenance: false
      - name: Release build cache before exporting image
        # The cache is already uploaded and the image loaded into Docker. Keeping both the
        # builder cache and an exported rootfs can exhaust the hosted runner's disk.
        run: docker buildx prune --all --force
      - name: Check image before publishing
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          container=$(docker create "local/app:$SOURCE_SHA")
          trap 'docker rm -f "$container" >/dev/null; rm -f /tmp/app-rootfs.tar' EXIT
          docker export "$container" -o /tmp/app-rootfs.tar
          bash infra/compose/check-image.sh /tmp/app-rootfs.tar
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "local/app:$SOURCE_SHA")" = linux/amd64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish checked image
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker tag "local/app:$SOURCE_SHA" "$IMAGE:sha-$SOURCE_SHA"
          docker push "$IMAGE:sha-$SOURCE_SHA"
          # A rerun of an old commit may publish its immutable tag, but cannot roll back latest.
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then
            docker tag "local/app:$SOURCE_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
