name: BotONE desktop build (self-hosted)

# Runs on a personal macOS ARM64 runner registered to this repository.
# Windows NSIS installers are cross-built from macOS (unsigned preview).
# Deliberately manual only: never add pull_request or push triggers here, because
# a public repository must not run untrusted code on a self-hosted machine.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        default: macos
        options: [macos, windows]
      arch:
        description: Architecture (macOS only, all = arm64 + x64)
        type: choice
        default: all
        options: [all, arm64, x64, universal]

permissions:
  contents: read

# Workflow-level so that `uses:` actions (setup-node, electron-builder downloads) inherit
# them too: step-level env only reaches `run:` steps. Direct connections to GitHub and
# nodejs.org download hosts time out from this runner's network; route through the machine's
# local proxy (override with the RUNNER_PROXY_URL repository variable).
env:
  HTTPS_PROXY: ${{ vars.RUNNER_PROXY_URL || 'http://127.0.0.1:7897' }}
  HTTP_PROXY: ${{ vars.RUNNER_PROXY_URL || 'http://127.0.0.1:7897' }}
  NO_PROXY: localhost,127.0.0.1

jobs:
  build:
    name: ${{ inputs.platform }} ${{ matrix.arch }} preview on self-hosted runner
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # One job per architecture; the single runner executes them one after another.
        arch: ${{ fromJSON(inputs.platform != 'macos' && '["none"]' || (inputs.arch == 'all' && '["arm64","x64"]' || format('["{0}"]', inputs.arch))) }}
    env:
      CI: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RAKAZO_ALLOW_DEV_SECRETS: "1"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Self-hosted runners have no node preinstalled, so every node step must come
      # after setup-node. No GitHub Actions cache: restoring and saving pnpm stores over
      # the proxy stalls for many minutes, and the machine keeps its own pnpm store,
      # node tool cache and electron-builder cache between jobs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install dependencies and Electron binary
        run: |
          set -euo pipefail
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm_config_prefer_offline=true
          pnpm install --frozen-lockfile
          install_js="$(pnpm --filter @rakazo/desktop exec node -p "require('path').join(require('path').dirname(require.resolve('electron/package.json')), 'install.js')")"
          for attempt in 1 2 3 4; do
            node "$install_js" && break
            [[ "$attempt" -lt 4 ]] || { echo "Electron binary download failed" >&2; exit 1; }
            sleep $((attempt * 10))
          done
      - name: Require a configured desktop server
        run: node -e 'if (!process.env.EXPO_PUBLIC_API_URL?.trim()) throw new Error("Set EXPO_PUBLIC_API_URL before building desktop previews")'
      - name: Generate database client for compilation
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Build web renderer and desktop main process
        run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build
      - name: Package macOS app
        if: inputs.platform == 'macos'
        run: >-
          pnpm --filter @rakazo/desktop exec electron-builder
          --config ../../.github/builds/desktop.cjs --mac --${{ matrix.arch }} --publish never
      - name: Verify macOS app and disabled updater
        if: inputs.platform == 'macos'
        run: |
          set -euo pipefail
          # electron-builder on this ARM64 host: --x64 writes out/mac, --arm64 writes out/mac-arm64,
          # --universal writes out/mac-universal.
          app="apps/desktop/out/mac${{ matrix.arch != 'x64' && format('-{0}', matrix.arch) || '' }}/BotONE Preview.app"
          codesign --verify --deep --strict "$app"
          test ! -e "$app/Contents/Resources/app-update.yml"
          test -s "$app/Contents/Resources/web/index.html"
          node .github/builds/verify-desktop-server.mjs "$app/Contents/Resources/app.asar"
      - name: Package Windows x64 app
        if: inputs.platform == 'windows'
        run: >-
          pnpm --filter @rakazo/desktop exec electron-builder
          --config ../../.github/builds/desktop.cjs --win --x64 --publish never
      - name: Verify Windows app and disabled updater
        if: inputs.platform == 'windows'
        run: |
          set -euo pipefail
          test -s "apps/desktop/out/win-unpacked/BotONE Preview.exe"
          test ! -e apps/desktop/out/win-unpacked/resources/app-update.yml
          test -s apps/desktop/out/win-unpacked/resources/web/index.html
          node .github/builds/verify-desktop-server.mjs apps/desktop/out/win-unpacked/resources/app.asar
      - name: Retain installers
        if: inputs.platform == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botone-macos-selfhosted-${{ github.run_number }}-${{ matrix.arch }}
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain installers
        if: inputs.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botone-windows-selfhosted-${{ github.run_number }}
          path: |
            apps/desktop/out/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
