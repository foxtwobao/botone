name: BotONE desktop build (self-hosted)

# Runs on a personal macOS ARM64 runner registered to this repository.
# Windows NSIS installers are cross-built from macOS (unsigned preview).
# Deliberately manual only: never add pull_request or push triggers here, because
# a public repository must not run untrusted code on a self-hosted machine.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        default: macos
        options: [macos, windows]
      arch:
        description: Architecture (macOS only)
        type: choice
        default: arm64
        options: [arm64, x64, universal]

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }} preview on self-hosted runner
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    env:
      CI: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RAKAZO_ALLOW_DEV_SECRETS: "1"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Self-hosted runners have no node preinstalled, so every node step must come
      # after setup-workspace installs it (unlike GitHub-hosted runners).
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          filter: "*"
      - name: Require a configured desktop server
        run: node -e 'if (!process.env.EXPO_PUBLIC_API_URL?.trim()) throw new Error("Set EXPO_PUBLIC_API_URL before building desktop previews")'
      - name: Generate database client for compilation
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Build web renderer and desktop main process
        run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build
      - name: Package macOS app
        if: inputs.platform == 'macos'
        # icon.png override: the Icon Composer .icon format needs actool from a full Xcode
        # install; the png-built icns works with Command Line Tools only. Remove the override
        # after installing Xcode 26+ on the runner machine.
        run: >-
          pnpm --filter @rakazo/desktop exec electron-builder
          --config ../../.github/builds/desktop.cjs --mac --${{ inputs.arch }} --publish never
          -c.mac.icon=assets/icon.png
      - name: Verify macOS app and disabled updater
        if: inputs.platform == 'macos'
        run: |
          set -euo pipefail
          # electron-builder writes the default arch (arm64/x64 on their native host) to
          # out/mac and only universal gets a suffix.
          app="apps/desktop/out/mac${{ inputs.arch == 'universal' && '-universal' || '' }}/BotONE Preview.app"
          codesign --verify --deep --strict "$app"
          test ! -e "$app/Contents/Resources/app-update.yml"
          test -s "$app/Contents/Resources/web/index.html"
          node .github/builds/verify-desktop-server.mjs "$app/Contents/Resources/app.asar"
      - name: Package Windows x64 app
        if: inputs.platform == 'windows'
        run: >-
          pnpm --filter @rakazo/desktop exec electron-builder
          --config ../../.github/builds/desktop.cjs --win --x64 --publish never
      - name: Verify Windows app and disabled updater
        if: inputs.platform == 'windows'
        run: |
          set -euo pipefail
          test -s "apps/desktop/out/win-unpacked/BotONE Preview.exe"
          test ! -e apps/desktop/out/win-unpacked/resources/app-update.yml
          test -s apps/desktop/out/win-unpacked/resources/web/index.html
          node .github/builds/verify-desktop-server.mjs apps/desktop/out/win-unpacked/resources/app.asar
      - name: Retain installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botone-${{ inputs.platform }}-selfhosted-${{ github.run_number }}
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
