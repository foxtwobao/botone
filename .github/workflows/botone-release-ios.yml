name: BotONE iOS release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (empty uses the workflow run number)
        type: string
        default: ""
      source_run_id:
        description: Upload an existing successful run's IPA instead of rebuilding (Actions run ID, not run number)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Signed iOS IPA
    if: inputs.source_run_id == ''
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
      BOTONE_MOBILE_APP_ID: ${{ vars.BOTONE_MOBILE_APP_ID }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate signing configuration and prepare mobile identity
        env: &ios-signing
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          IOS_NOTIFICATION_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_PROFILE_BASE64 }}
        run: |
          node .github/builds/release-config.mjs ios
          python3 .github/builds/build-ios-release.py --validate-only
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@rakazo/mobile..."
      - name: Generate iOS project
        run: pnpm --filter @rakazo/mobile exec expo prebuild --platform ios
      - name: Archive and export signed IPA
        env: *ios-signing
        run: python3 .github/builds/build-ios-release.py
      - name: Retain IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: botone-ios-release-${{ github.run_number }}
          path: ${{ runner.temp }}/botone-ios-release/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Summarize build
        run: echo 'Signed IPA retained for 30 days. The upload job sends it to App Store Connect without submitting App Review.' >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: Upload to App Store Connect
    needs: build
    if: ${{ !cancelled() && ((inputs.source_run_id == '' && needs.build.result == 'success') || (inputs.source_run_id != '' && needs.build.result == 'skipped')) }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test upload handling
        run: python3 .github/builds/test_ios_upload.py
      - name: Validate App Store Connect upload secrets
        env: &asc-upload
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 .github/builds/upload-ios-release.py --validate-only
      - name: Select signed IPA artifact
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/builds/upload-ios-release.py --select-source
      - name: Download signed IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: ${{ runner.temp }}/botone-ios-upload
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Upload IPA
        env: *asc-upload
        run: python3 .github/builds/upload-ios-release.py "$RUNNER_TEMP/botone-ios-upload"
      - name: Summarize upload
        run: echo 'IPA uploaded to App Store Connect. After Apple processing, configure TestFlight testers to install it. App Review was not submitted.' >> "$GITHUB_STEP_SUMMARY"
