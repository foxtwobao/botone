appId: com.rakazo.app
---
# Restart without clearing app data, so a dev client's bundler URL stays put.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Account|Settings|Sign up for BotONE|Sign in to BotONE"
    timeout: 40000
- runFlow:
    when:
      visible: "Account|Settings"
    commands:
      - tapOn: "Account|Settings"
      - scrollUntilVisible:
          element: "Sign out"
          direction: DOWN
          timeout: 15000
      - tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign up for BotONE|Sign in to BotONE"
    timeout: 20000
