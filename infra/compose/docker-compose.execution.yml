# Prepared CLI layer; execution uses the existing supervisor connection.
services:
  computer:
    image: ${RAKAZO_COMPUTER_IMAGE:?Select the prepared computer image}
    build: !reset null
    pull_policy: never
  worker:
    environment:
      BETTER_AUTH_URL:
  supervisor:
    environment:
      RAKAZO_COMPUTER_IMAGE: ${RAKAZO_COMPUTER_IMAGE:?Select the prepared computer image}
